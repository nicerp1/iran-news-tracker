<!-- index.html -->
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اخبار ایران و منطقه | Iran News Tracker</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #12121a;
            --bg-card: #1a1a25;
            --text-primary: #e8e8ed;
            --text-secondary: #8b8b96;
            --accent-red: #dc3545;
            --accent-orange: #fd7e14;
            --accent-green: #28a745;
            --accent-blue: #0d6efd;
            --border-color: #2a2a35;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.8;
            min-height: 100vh;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        header {
            text-align: center;
            padding: 40px 0;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 30px;
        }
        
        header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #dc3545, #fd7e14);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .stats {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        
        .stat {
            background: var(--bg-secondary);
            padding: 15px 25px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
        }
        
        .stat-value { font-size: 1.5rem; font-weight: bold; }
        .stat-label { color: var(--text-secondary); font-size: 0.9rem; }
        
        .filters {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }
        
        .filter-btn {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 10px 20px;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .filter-btn:hover, .filter-btn.active {
            background: var(--accent-red);
            border-color: var(--accent-red);
        }
        
        .news-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
        }
        
        .news-card {
            background: var(--bg-card);
            border-radius: 15px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            transition: transform 0.3s, box-shadow 0.3s;
        }
        
        .news-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 40px rgba(220, 53, 69, 0.2);
        }
        
        .card-header {
            padding: 20px;
            border-bottom: 1px solid var(--border-color);
        }
        
        .card-header h3 {
            font-size: 1.1rem;
            margin-bottom: 10px;
            line-height: 1.6;
        }
        
        .card-meta {
            display: flex;
            gap: 15px;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }
        
        .tag {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 15px;
            font-size: 0.75rem;
            font-weight: bold;
        }
        
        .tag-نظامی { background: var(--accent-red); }
        .tag-تحریم_فشار { background: var(--accent-orange); }
        .tag-دیپلماسی { background: var(--accent-blue); }
        .tag-عمومی { background: var(--text-secondary); }
        
        .card-body {
            padding: 20px;
        }
        
        .summary {
            color: var(--text-secondary);
            font-size: 0.95rem;
            margin-bottom: 15px;
        }
        
        .impact {
            background: var(--bg-secondary);
            padding: 12px;
            border-radius: 8px;
            font-size: 0.9rem;
            border-right: 3px solid var(--accent-red);
            margin-bottom: 15px;
        }
        
        .metrics {
            display: flex;
            gap: 20px;
            font-size: 0.85rem;
        }
        
        .metric {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        .urgency-bar {
            width: 60px;
            height: 6px;
            background: var(--bg-secondary);
            border-radius: 3px;
            overflow: hidden;
        }
        
        .urgency-fill {
            height: 100%;
            border-radius: 3px;
            transition: width 0.3s;
        }
        
        .sentiment-positive { color: var(--accent-green); }
        .sentiment-negative { color: var(--accent-red); }
        .sentiment-neutral { color: var(--text-secondary); }
        
        .card-footer {
            padding: 15px 20px;
            border-top: 1px solid var(--border-color);
        }
        
        .read-more {
            display: inline-block;
            color: var(--accent-blue);
            text-decoration: none;
            font-size: 0.9rem;
        }
        
        .read-more:hover { text-decoration: underline; }
        
        .last-update {
            text-align: center;
            color: var(--text-secondary);
            margin-top: 40px;
            padding: 20px;
        }
        
        @media (max-width: 768px) {
            .news-grid { grid-template-columns: 1fr; }
            header h1 { font-size: 1.8rem; }
            .stats { gap: 15px; }
            .stat { padding: 10px 15px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📰 اخبار ایران و منطقه</h1>
            <p style="color: var(--text-secondary);">ردیابی لحظه‌ای تحولات منطقه‌ای</p>
            
            <div class="stats">
                <div class="stat">
                    <div class="stat-value" id="total-count">-</div>
                    <div class="stat-label">کل اخبار</div>
                </div>
                <div class="stat">
                    <div class="stat-value" id="avg-urgency">-</div>
                    <div class="stat-label">میانگین فوریت</div>
                </div>
                <div class="stat">
                    <div class="stat-value" id="avg-sentiment">-</div>
                    <div class="stat-label">میانگین احساسات</div>
                </div>
            </div>
        </header>
        
        <div class="filters">
            <button class="filter-btn active" data-filter="all">همه</button>
            <button class="filter-btn" data-filter="نظامی">نظامی</button>
            <button class="filter-btn" data-filter="تحریم_فشار">تحریم و فشار</button>
            <button class="filter-btn" data-filter="دیپلماسی">دیپلماتیک</button>
            <button class="filter-btn" data-filter="urgent">فوری بالا</button>
        </div>
        
        <div class="news-grid" id="news-grid">
            <!-- اخبار اینجا بارگذاری می‌شوند -->
        </div>
        
        <div class="last-update" id="last-update">
            در حال بارگذاری...
        </div>
    </div>
    
    <script>
        // بارگذاری JSON از فایل
        async function loadNews() {
            try {
                const response = await fetch('data/news.json');
                const news = await response.json();
                renderNews(news);
                updateStats(news);
            } catch (error) {
                console.error('خطا در بارگذاری اخبار:', error);
                document.getElementById('news-grid').innerHTML = 
                    '<p style="text-align:center; color: var(--accent-red);">خطا در بارگذاری اخبار</p>';
            }
        }
        
        function renderNews(news) {
            const grid = document.getElementById('news-grid');
            grid.innerHTML = news.map(item => createCard(item)).join('');
            
            // آپدیت زمان
            const lastUpdate = document.getElementById('last-update');
            lastUpdate.textContent = `آخرین به‌روزرسانی: ${new Date().toLocaleString('fa-IR')}`;
        }
        
        function createCard(item) {
            const urgencyColor = item.urgency > 7 ? 'var(--accent-red)' : 
                                 item.urgency > 4 ? 'var(--accent-orange)' : 'var(--accent-green)';
            
            const sentimentClass = item.sentiment > 0.2 ? 'sentiment-positive' :
                                   item.sentiment < -0.2 ? 'sentiment-negative' : 'sentiment-neutral';
            
            const sentimentIcon = item.sentiment > 0.2 ? '📈' :
                                  item.sentiment < -0.2 ? '📉' : '➡️';
            
            const tagClass = item.tag.replace('_', '-');
            
            const summary = Array.isArray(item.summary) ? item.summary[0] : item.summary;
            
            return `
                <article class="news-card">
                    <div class="card-header">
                        <h3>${item.title_fa || item.title_en}</h3>
                        <div class="card-meta">
                            <span class="tag tag-${tagClass}">${item.tag}</span>
                            <span>📍 ${item.source}</span>
                        </div>
                    </div>
                    <div class="card-body">
                        <p class="summary">${summary.substring(0, 200)}...</p>
                        <div class="impact">⚡ ${item.impact}</div>
                        <div class="metrics">
                            <div class="metric">
                                <span>🔥 فوریت:</span>
                                <div class="urgency-bar">
                                    <div class="urgency-fill" style="width: ${item.urgency * 10}%; background: ${urgencyColor}"></div>
                                </div>
                                <span>${item.urgency}/10</span>
                            </div>
                            <div class="metric ${sentimentClass}">
                                <span>${sentimentIcon} احساسات: ${item.sentiment}</span>
                            </div>
                        </div>
                    </div>
                    <div class="card-footer">
                        <a href="${item.url}" target="_blank" class="read-more">
                            مطالعه کامل ←
                        </a>
                    </div>
                </article>
            `;
        }
        
        function updateStats(news) {
            document.getElementById('total-count').textContent = news.length;
            
            const avgUrgency = (news.reduce((sum, n) => sum + n.urgency, 0) / news.length).toFixed(1);
            document.getElementById('avg-urgency').textContent = avgUrgency;
            
            const avgSentiment = (news.reduce((sum, n) => sum + n.sentiment, 0) / news.length).toFixed(2);
            document.getElementById('avg-sentiment').textContent = avgSentiment;
        }
        
        // فیلترها
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', async () => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                
                const filter = btn.dataset.filter;
                const response = await fetch('data/news.json');
                let news = await response.json();
                
                if (filter === 'urgent') {
                    news = news.filter(n => n.urgency >= 7);
                } else if (filter !== 'all') {
                    news = news.filter(n => n.tag === filter);
                }
                
                renderNews(news);
            });
        });
        
        // بارگذاری اولیه
        loadNews();
    </script>
</body>
</html>
